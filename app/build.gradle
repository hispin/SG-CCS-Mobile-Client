plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.sensoguard.ccsmobileclient'
    compileSdk 37

    defaultConfig {
        applicationId "com.sensoguard.ccsmobileclient"
        minSdk 26
        targetSdk 37
        versionCode 40
        versionName "1.40"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("sensorKeystore.jks")
            storePassword "sensor1234"
            keyAlias "sensoralias"
            keyPassword "sensor1234"
        }
    }

    bundle {
        //prevent google play filter the resource that the device does not support
        language {
            enableSplit = false
        }
    }


    buildTypes {
        release {
            signingConfig signingConfigs.release

            //remove the unused code of the libraries (see the rules of javax mail in proguard-rules.pro)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            pickFirsts.add('META-INF/NOTICE.md')
            pickFirsts.add('META-INF/LICENSE.md')
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    exclude module: 'commons-logging'
}


dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'com.google.android.material:material:1.14.0'

    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.opencsv:opencsv:5.12.0'

    //Support language
    implementation 'com.github.delight-im:Android-Languages:v1.0.1'

    //map box
    implementation 'com.mapbox.maps:android-ndk27:11.14.4'
    implementation 'com.mapbox.mapboxsdk:mapbox-sdk-geojson:6.9.0'

    //email sending
    implementation 'com.sun.mail:android-mail:1.6.8'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"

    //firebase
    implementation 'com.google.firebase:firebase-messaging:26.0.0'
    implementation 'com.google.firebase:firebase-analytics:24.0.0'
    implementation 'com.google.firebase:firebase-messaging-directboot:26.0.0'

    //calendar for sorting the alarm log by date
    implementation 'com.squareup:android-times-square:1.7.11@aar'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
}
